# Dépôt F-Droid LiXee, servi par GitHub Pages.
#
# À chaque version publiée (ou à la demande), les APK « libres » joints aux
# versions GitHub sont rassemblés, indexés et signés par fdroidserver, puis
# mis en ligne. L'adresse à donner à F-Droid :
#
#   https://fairecasoimeme.github.io/LiXee-Assist/fdroid/repo
#
# Secrets attendus (voir doc/fdroid/README.md) :
#   FDROID_KEYSTORE_B64   le magasin de clés du dépôt, encodé en base64
#   FDROID_KEYSTORE_PASS  son mot de passe
name: Dépôt F-Droid

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Une version publiée déclenche le workflow sur son étiquette, et GitHub
  # Pages n'accepte un déploiement que depuis la branche par défaut : on
  # relance donc le workflow sur master, qui fait le travail.
  relay:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fdroid-repo.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pas le paquet d'Ubuntu : son androguard, trop ancien, ne lit pas les
      # APK des outils Android récents (« res1 must be zero! »).
      - name: Installer fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner
          pipx install fdroidserver
          pipx inject fdroidserver 'androguard>=4.1.2'
          fdroid --version

      - name: Rassembler les APK libres des versions publiées
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fdroid/repo
          for tag in $(gh release list --limit 30 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern 'lixee-assist-libre-*.apk' \
              --dir fdroid/repo --skip-existing || true
          done
          ls -l fdroid/repo
          # Sans APK, l'index serait vide : mieux vaut échouer que le publier.
          ls fdroid/repo/*.apk > /dev/null

      - name: Indexer et signer le dépôt
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          # Chaque échec est annoncé en clair : une annotation se lit depuis
          # la page de l'exécution, sans ouvrir le journal.
          fail() { echo "::error::$1"; exit 1; }

          [ -n "$KEYSTORE_B64" ] || fail "Le secret FDROID_KEYSTORE_B64 est absent ou vide."
          [ -n "$KEYSTORE_PASS" ] || fail "Le secret FDROID_KEYSTORE_PASS est absent ou vide."

          cd fdroid
          # Un copier-coller ajoute volontiers des espaces et des retours à
          # la ligne.
          echo "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > keystore.p12 \
            || fail "FDROID_KEYSTORE_B64 n'est pas un texte base64 valide."
          keytool -list -keystore keystore.p12 -storepass:env KEYSTORE_PASS \
            -alias lixee-fdroid > /dev/null 2> keytool.err \
            || fail "Magasin de clés illisible (mot de passe ou alias ?) : $(tail -n 1 keytool.err)"

          # Les mots de passe restent dans l'environnement : fdroidserver les
          # y lit, et aucun caractère spécial ne peut casser le fichier.
          {
            cat config.base.yml
            echo "keystore: keystore.p12"
            echo "repo_keyalias: lixee-fdroid"
            echo "keystorepass: {env: KEYSTORE_PASS}"
            echo "keypass: {env: KEYSTORE_PASS}"
          } > config.yml
          chmod 600 config.yml keystore.p12
          mkdir -p repo/icons
          cp icon.png repo/icons/icon.png

          if ! fdroid update --verbose > update.log 2>&1; then
            tail -n 60 update.log
            fail "fdroid update a échoué : $(grep -iE 'error|critical|exception|traceback' update.log | tail -n 3 | tr '\n' ' ' | cut -c1-600)"
          fi
          tail -n 15 update.log
          rm -f config.yml keystore.p12 keytool.err update.log

      - name: Préparer le site
        run: |
          mkdir -p site/fdroid
          cp -r fdroid/repo site/fdroid/repo
          cp fdroid/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
